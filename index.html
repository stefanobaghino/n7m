<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>n7m — numeronym generator</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #2f6fed;
    --card: #ffffff;
    --border: #e2e2e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14151a;
      --fg: #eaeaea;
      --muted: #9a9a9a;
      --accent: #6ea1ff;
      --card: #1d1e24;
      --border: #2c2d34;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  main {
    width: 100%;
    max-width: 640px;
  }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 24px;
    text-align: center;
  }
  textarea {
    width: 100%;
    min-height: 120px;
    padding: 12px 14px;
    font-size: 1rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--fg);
    resize: vertical;
  }
  textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .results {
    margin-top: 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .row .word {
    color: var(--muted);
    font-size: 0.85rem;
    overflow-wrap: anywhere;
  }
  .row .numeronym {
    font-weight: 600;
    font-size: 1.05rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  button.copy {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  button.copy:hover {
    color: var(--fg);
    border-color: var(--accent);
  }
  .row.placeholder .numeronym {
    color: var(--muted);
    animation: ellipsis-fade 3s ease-in-out forwards;
  }
  @keyframes ellipsis-fade {
    0% { opacity: 1; }
    100% { opacity: 0.1; }
  }
</style>
</head>
<body>
<main>
  <h1>n7m</h1>

  <textarea id="input" placeholder="Type or paste words, one per line…" maxlength="256" autofocus></textarea>

  <div id="results" class="results"></div>
</main>

<script>
  const input = document.getElementById('input');
  const results = document.getElementById('results');

  const MAX_CODEPOINTS = 256;

  const isAlpha = c => /\p{L}/u.test(c);

  function numeronym(line) {
    const chars = Array.from(line);
    let start = 0;
    let end = chars.length - 1;
    while (start <= end && !isAlpha(chars[start])) start++;
    while (end >= start && !isAlpha(chars[end])) end--;
    const trimmed = chars.slice(start, end + 1);
    const alphaCount = trimmed.filter(isAlpha).length;
    if (alphaCount <= 3) return null;
    const first = trimmed[0].toLowerCase();
    const last = trimmed[trimmed.length - 1].toLowerCase();
    const middleAlphaCount = alphaCount - 2;
    return first + middleAlphaCount + last;
  }

  function enforceLimit() {
    const chars = Array.from(input.value);
    if (chars.length > MAX_CODEPOINTS) {
      input.value = chars.slice(0, MAX_CODEPOINTS).join('');
    }
  }

  function getCursorLineIndex() {
    const pos = input.selectionStart ?? input.value.length;
    return input.value.slice(0, pos).split('\n').length - 1;
  }

  function buildRow(word, generated) {
    const row = document.createElement('div');
    row.className = 'row';

    const left = document.createElement('div');
    const num = document.createElement('div');
    num.className = 'numeronym';
    num.textContent = generated;
    const orig = document.createElement('div');
    orig.className = 'word';
    orig.textContent = word;
    left.appendChild(num);
    left.appendChild(orig);

    const btn = document.createElement('button');
    btn.className = 'copy';
    btn.textContent = 'Copy';
    btn.addEventListener('click', () => {
      navigator.clipboard.writeText(generated).then(() => {
        btn.textContent = 'Copied';
        setTimeout(() => (btn.textContent = 'Copy'), 1200);
      });
    });

    row.appendChild(left);
    row.appendChild(btn);
    return row;
  }

  function buildPlaceholderRow(word) {
    const row = document.createElement('div');
    row.className = 'row placeholder';

    const left = document.createElement('div');
    const num = document.createElement('div');
    num.className = 'numeronym';
    num.textContent = '…';
    const orig = document.createElement('div');
    orig.className = 'word';
    orig.textContent = word;
    left.appendChild(num);
    left.appendChild(orig);

    row.appendChild(left);
    return row;
  }

  // Tracks the placeholder for whichever unresolved line is currently being
  // typed into, so it disappears if the line resolves, if input moves to a
  // different line, or if it stays unresolved for 3 seconds.
  const placeholder = { key: null, timeoutId: null, expired: false };

  function render() {
    enforceLimit();
    const rawLines = input.value.split('\n');
    const cursorLineIndex = getCursorLineIndex();

    const activeLine = (rawLines[cursorLineIndex] || '').trim();
    const activeIdx =
      activeLine.length > 0 && numeronym(activeLine) === null ? cursorLineIndex : null;
    const activeKey = activeIdx === null ? null : `${activeIdx}:${activeLine}`;

    if (activeKey !== placeholder.key) {
      clearTimeout(placeholder.timeoutId);
      placeholder.key = activeKey;
      placeholder.timeoutId = null;
      placeholder.expired = false;
      if (activeKey !== null) {
        placeholder.timeoutId = setTimeout(() => {
          placeholder.expired = true;
          placeholder.timeoutId = null;
          render();
        }, 3000);
      }
    }

    results.innerHTML = '';

    rawLines.forEach((rawLine, idx) => {
      const word = rawLine.trim();
      if (word.length === 0) return;
      const generated = numeronym(word);

      if (generated !== null) {
        results.appendChild(buildRow(word, generated));
      } else if (idx === activeIdx && !placeholder.expired) {
        results.appendChild(buildPlaceholderRow(word));
      }
    });
  }

  input.addEventListener('input', render);
  render();
</script>
</body>
</html>
